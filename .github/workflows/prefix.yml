name: Prefix evidence
on:
  push:
  pull_request:
jobs:
  installed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: PYTHONPATH=. python tools/build_prefix_controls.py && git diff --exit-code -- docs/prefix-data.js examples/prefix-selection.json
      - run: bash tools/prefix_wheel_smoke.sh
  independent-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: node --test tests/test_prefix_engine.cjs tests/test_prefix_browser.cjs
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
