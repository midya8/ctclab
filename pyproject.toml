[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ctclab"
version = "0.2.0"
requires-python = ">=3.10"
description = "Inspectable CTC target marginalization, posteriors and gradients"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Midya Rahmani"}]
[project.scripts]
ctclab = "ctclab.cli:main"
ctclab-prefix = "ctclab.prefix_cli:main"
[tool.setuptools.packages.find]
include = ["ctclab*"]
